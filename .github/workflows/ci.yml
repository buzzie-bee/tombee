name: CI

on:
  pull_request:
    branches: [master, develop]

env:
  REGISTRY: ghcr.io
  PW_IMAGE: ghcr.io/${{ github.repository }}-playwright

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  playwright-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.pw.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Playwright version
        id: pw
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'].replace('^',''))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=pw-$version" >> "$GITHUB_OUTPUT"

      - name: Check if image exists
        id: check
        run: |
          if docker manifest inspect ${{ env.PW_IMAGE }}:pw-${{ steps.pw.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/playwright.Dockerfile
          push: true
          tags: |
            ${{ env.PW_IMAGE }}:latest
            ${{ env.PW_IMAGE }}:pw-${{ steps.pw.outputs.version }}
          cache-from: type=gha,scope=playwright
          cache-to: type=gha,scope=playwright,mode=max

  e2e:
    needs: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}-playwright:${{ needs.playwright-image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v6

      - run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-build:
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
